; Conservative native Windows C4 starting profile. Restart after editing.
; Copy next to the rebuilt d3d9.dll. Never replace player Option.ini/l2.ini.
[general]
; Temporarily set to 1 for startup/capability diagnostics in d3d9_proxy.log.
logging=0

[fps]
; 0 disables the corresponding cap. Foreground: 0-1000; background: 0-120.
limit=60
min_fps=8

[graphics]
; 0/1 preserves game AF. 2-16 is clamped to device caps.
; Deliberate point filtering and game mip filtering are preserved.
anisotropy=16
; 0 preserves game LOD. Negative values may increase shimmer. Range -4..4.
lod_bias=0.0

[fog]
; 0: game; 1: configured color+linear distances; 2: game color+linear distances.
; Both overrides respect game FOGENABLE, avoiding fog in explicitly disabled passes.
mode=0
start=4096.0
end=16384.0
color=0xC8D4E8

[latency]
; Optional Device9Ex API only, 0-16. Classic native D3D9 usually lacks this.
; There is no GPU-sync fallback. FPS cap is independent of queue-depth control.
frame_latency=0

[detector]
; Requires logging=1. Dumps draw/lighting counts and desired fog on release/hotkey.
enabled=0

[hotkeys]
; Focused viewport only. Empty disables. Named keys or hex VK such as 0x77.
toggle=ScrollLock
detect=
