name: Windows x86
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A Win32
      - name: Build (warnings are errors)
        run: cmake --build build --config Release
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Package
        run: cmake --install build --config Release --prefix out/c4
      - uses: actions/upload-artifact@v4
        with:
          name: d3d9-c4-win32
          path: out/c4/
